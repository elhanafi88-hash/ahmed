    catch(e){V().innerHTML='<div class="panel empty"><b>'+t('الحساب ده مالوش صلاحية','This account has no access')+'</b><div class="mono" style="font-size:12px">'+esc(e.message)+'</div></div>';addLogout();return}
    await new Promise(r=>{let first=true;fs.collection('blobs').onSnapshot(s=>{for(const ch of s.docChanges()){const id=ch.doc.id;
        if(ch.type==='removed'){delete META[id];if(PURL[id]){URL.revokeObjectURL(PURL[id]);delete PURL[id]}continue}
        const m=ch.doc.data();META[id]={ct:m.ct,size:m.size,n:m.n||0,d:m.d||null};
        if(m.d&&!PURL[id])PURL[id]=URL.createObjectURL(new Blob([m.d.toUint8Array()],{type:m.ct}))}
      applyPurl();if(first){first=false;r()}},()=>{if(first){first=false;r()}})});
    addLogout();readyResolve();
    const iv=setInterval(()=>{try{if(typeof S!=='undefined'&&S){applyPurl();if(S.ready)clearInterval(iv)}}catch(e){}},300);
  });
})();
</script>

const kHm=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+pad(m)+(h<12?' AM':' PM')};

async function kPunch(x){if(K.busy||!K.k)return;if(!S.db)return toast('Saving not available');K.busy=true;const k=K.k;const {ymd,hm}=kNow();const SH=SHIFT();let note='';

    const ins=r.k[d].filter(z=>z.x==='in');const firstIn=ins.length?ins[0].t:'';
    if(x==='out'){let i=firstIn||(r.t&&r.t[d]&&r.t[d].i)||SH.s;if(!firstIn&&!(r.t&&r.t[d]))note='No IN recorded — counted from 7 AM';if(tmin(i)<tmin(SH.s))i=SH.s;r.t=r.t||{};r.t[d]={i,o:hm}}
    attSaving=true;try{await S.db.collection('attendance').doc(o.m).set(S.att[o.m]);savedFlash&&savedFlash()}finally{attSaving=false}
    K.done={k,x,t:hm,note};K.k=null;K.code='';K.list=null}catch(err){toast(ERRSAVE())}finally{K.busy=false}
  renderKiosk($('#view'))}

  if(K.pinMode){if(v==='⌫')K.pin=K.pin.slice(0,-1);else if(v==='OK'){if(K.pin===kGetPin())return kLeave();K.err='Wrong PIN';K.pin=''}else if(/^\d$/.test(v)&&K.pin.length<8){K.pin+=v;K.err=''}renderKiosk($('#view'));return}

function filteredWorkers(){const f=S.f,q=f.q.trim().toLowerCase();
  const m=(val,fv)=>!fv||(fv==='_none'?!val:val===fv);
  let list=S.emps.filter(e=>{
    if(q&&![e.name,e.empId,e.eid,e.passportNo,e.mobile,e.designation,e.visaNo].join(' ').toLowerCase().includes(q))return false;
    if(f.vs==='_proc'?!PROC.includes(e.visaStatus):!m(e.visaStatus,f.vs))return false;
    if(!m(e.department,f.dept)||!m(e.company,f.comp)||!m(e.location,f.loc)||!m(e.nationality,f.nat))return false;
    if(f.st==='_active'){if(INACTIVE.has(e.status)&&!q)return false}else if(f.st&&!m(e.status,f.st))return false;
    if(f.wt&&(f.wt==='Supplier')!==isSup(e))return false;
    if(f.vt&&e.visaType!==f.vt)return false;
    if(f.nw&&!isNewW(e))return false;
    if(f.miss&&!(MISS[f.miss].f(e)&&!INACTIVE.has(e.status)))return false;
    return true});
  const s=f.sort,dir=f.dir;
  const key=e=>s==='near'?(nearest(e)?.n??99999):s==='sn'?(e.sn||0):String(e[s]||'￿').toLowerCase();
  const pin=e=>{const i=PIN_TOP.indexOf(String(e.empId||''));return i<0?99:i};
  return list.sort((a,b)=>{if(s==='sn'&&dir>0){const pa=pin(a),pb=pin(b);if(pa!==pb)return pa-pb}const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*dir})}

  $('#tform').addEventListener('submit',ev=>{ev.preventDefault();const wn=$('#t_wn').value;

async function printTermLetter(k,o){const e=byKey(k);if(!e)return;await preloadPhotos([e]);showReport(repTermLetter(e,o||{}),'Termination_Form_'+(e.empId||'')+'.html',_('فورم إنهاء خدمة ','Termination form ')+e.name,false,'A4 portrait')}
function repTermLetter(e,o){o=o||{};const g=SIGNER(),rs=o.reasons||[];
  const f=(l,val,cls)=>'<div class="lf'+(cls?' '+cls:'')+'"><div class="lf-l"><span>'+l+'</span></div><div class="lf-v">'+(val||'&nbsp;')+'</div></div>';
  const box='<i class="cbx"></i>',bx=on=>'<i class="cbx'+(on?' on':'')+'">'+(on?'✓':'')+'</i>';const m=x=>x?'<span class="mono">'+esc(x)+'</span>':'';
  const sig=(l,name)=>'<div class="ls"><div class="ls-n">'+(name?esc(name):'&nbsp;')+'</div><i></i><span>'+l+'</span><span class="ls-d">Date: ______________</span></div>';
  const why=['Poor performance','Misconduct / behaviour','Absence without permission','Absconding (7+ consecutive days)','Violation of company rules / safety','Repeated warnings','Failed probation','Redundancy / no work available','End of contract','Other (see details)'];
  const line='<div class="tline"></div>';
  return '<div class="rp lvf" dir="ltr">'+
   '<div class="v-head"><img class="v-logo" src="'+LOGO+'" alt="METAPLEX"><div class="v-title"><b>EMPLOYEE TERMINATION FORM</b><span>Notice of termination of employment</span></div><div class="v-no"><div><span>Emp. ID</span><b class="red">'+esc(e.empId||'—')+'</b></div><div><span>Date</span><b>'+dmy(TODAY)+'</b></div></div></div>'+
   '<h3 class="lh"><span>1 · Employee details</span></h3>'+
   '<div class="lemp"><div class="lph">'+rAv(e,'sq')+'</div><div class="lgrid">'+
    f('Name','<b>'+esc(e.name)+'</b>','w2')+f('Emp. ID / Code','<b class="mono">'+esc(e.empId||'')+'</b>')+f('Job title',esc(e.designation||''))+f('Department',esc(e.department||''))+f('Nationality',esc(e.nationality||''))+f('Passport no.',m(e.passportNo))+
    f('Joining date',e.joinDate?dmy(e.joinDate):'','w2')+'</div></div>'+
   '<h3 class="lh"><span>2 · Termination</span></h3>'+

   '<h3 class="lh"><span>3 · Reason for termination</span></h3>'+
   '<div class="ltypes tw">'+why.map(t=>'<span>'+bx(rs.includes(t))+esc(t)+'</span>').join('')+'</div>'+
   '<p class="ldecl"><b>Details:</b></p>'+(o.details?'<p class="tdet">'+esc(o.details).replace(/\n/g,'<br>')+'</p>':line+line+line+line)+
   '<h3 class="lh"><span>4 · Approval</span></h3>'+
   '<div class="lsigs">'+sig('HR','')+sig(esc(g.t),g.n)+sig('Management','')+'</div>'+
   '<h3 class="lh"><span>5 · Employee acknowledgement</span></h3>'+
   '<p class="ldecl">I acknowledge that I have received and read this termination notice.</p>'+
   '<div class="lsig1">'+sig('Employee signature',e.name)+'<div class="v-th"><em></em><span>Thumb</span></div></div>'+
   '<div class="v-foot"><span>METAPLEX STEEL · HR</span><span>TERM-'+esc(e.empId||'')+' · '+dmy(TODAY)+'</span></div></div>'}

async function shrink(file){let src,w,h;try{src=await createImageBitmap(file);w=src.width;h=src.height}catch(e){const url=URL.createObjectURL(file);src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});w=src.naturalWidth;h=src.naturalHeight}
  const s=Math.min(1,520/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86))}

async function savePhotoBlob(k,blob,note){toast(_('جاري رفع الصورة…','Uploading photo…'),8000);const r=await S.assets.upload(blob,{type:'image/jpeg'});S.purl[r.id]=r.url;

  if(old)S.assets.delete(old).catch(()=>{});toast(_('تم حفظ الصورة','Photo saved'))}
function rotCanvas(src,dir){const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;const c=document.createElement('canvas');c.width=h;c.height=w;const x=c.getContext('2d');x.translate(h/2,w/2);x.rotate(dir*Math.PI/2);x.drawImage(src,-w/2,-h/2,w,h);return c}
function rotAny(src,deg){const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,r=deg*Math.PI/180,cs=Math.abs(Math.cos(r)),sn=Math.abs(Math.sin(r));
  const c=document.createElement('canvas');c.width=Math.round(w*cs+h*sn);c.height=Math.round(w*sn+h*cs);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(r);x.drawImage(src,-w/2,-h/2,w,h);return c}
function drawRot(c,bm,deg,S){c.width=c.height=S;const x=c.getContext('2d'),w=bm.width,h=bm.height,r=deg*Math.PI/180;const k=S/Math.min(w,h)*(Math.abs(Math.cos(r))+Math.abs(Math.sin(r)));
  x.fillStyle='#fff';x.fillRect(0,0,S,S);x.save();x.translate(S/2,S/2);x.rotate(r);x.drawImage(bm,-w*k/2,-h*k/2,w*k,h*k);x.restore()}
const normDeg=d=>{d=((d%360)+360)%360;return d>180?d-360:d};

   '<p class="muted" style="margin:0;font-size:12.5px;text-align:center">'+_('حرّك المؤشر عشان تلف الصورة أي درجة من 0 لـ 360','Drag the slider to rotate to any angle, 0–360')+'</p>'+
   '</div><div class="m-f"><span style="flex:1"></span><button type="button" class="btn" data-act="mclose">'+_('إلغاء','Cancel')+'</button><button type="button" class="btn pri" id="rt_s">'+_('حفظ','Save')+'</button></div></div>');
  const c=$('#rt_c'),a=$('#rt_a');let deg=0,raf=0;const P=Math.min(480,Math.min(bm.width,bm.height));
  const upd=()=>{a.value=deg;$('#rt_v').textContent=deg+'°';cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>drawRot(c,bm,deg,P))};

      await savePhotoBlob(k,blob,_('تعديل اتجاه الصورة','Photo rotated')+' ('+deg+'°)');closeModal()}catch(err){bt.disabled=false;toast(_('تعذر حفظ الصورة: ','Could not save photo: ')+((err&&(err.message||err.code))||''))}}}
async function rotatePhoto(k,dir){const e=byKey(k);if(!e||!e.photo||!canWrite()||rotatePhoto.busy)return;rotatePhoto.busy=true;

  const crop=(size)=>{const s=srcOf(pw);if(!s||!g)return null;const n=g.s*s.f,o=Math.max(1,Math.round(Math.min(size,n)));const c=document.createElement('canvas');c.width=c.height=o;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o,o);x.drawImage(s.el,g.x*s.f,g.y*s.f,n,n,0,0,o,o);return c};

/* ---------- payroll ---------- */
function payCalc(r){const f=Math.min(num(r.days),30)/30;const basicE=num(r.basic)*f,allowE=num(r.allow)*f;const ot=num(r.otH)*(num(r.basic)/30/8)*1.25;const gross=basicE+allowE+ot+num(r.bonus);return{basicE,allowE,ot,gross,net:gross-num(r.deduct)-num(r.adv)}}
function raiseIn(k,month){const e=byKey(k);return e?(e.raises||[]).filter(r=>(r.d||'').startsWith(month)).reduce((s,r)=>s+num(r.amount),0):0}
function bonusIn(k,month){return S.bonuses.filter(b=>b.empKey===k&&(b.date||'').startsWith(month)).reduce((s,b)=>s+num(b.amount),0)}
function payRowFor(e,month){const at=attSum(e._k,month);return{name:e.name,empId:e.empId||'',designation:e.designation||'',basic:num(e.basic),allow:allowOf(e),days:at?at.pay:30,otH:at?at.ot:0,bonus:bonusIn(e._k,month),deduct:warnIn(e._k,month),adv:advIn(e._k,month)}}
function attPay(k,m){const e=byKey(k);if(!e)return null;const r=payRowFor(e,m);const pr=S.payroll[m]&&S.payroll[m].rows&&S.payroll[m].rows[k];
  if(pr)for(const f of ['basic','allow','bonus','deduct','adv'])if(pr[f]!==''&&pr[f]!=null)r[f]=num(pr[f]);
  const c=payCalc(r);return{...r,...c,rate:num(r.basic)/30/8*1.25}}
/* payable days if the worker stops on day `until` (final settlement): days 1..until minus absent/unpaid/empty */
function attDaysUntil(k,m,until){let bad=0;for(let d=1;d<=until;d++){const [v]=attCell(k,m,d);if(!v||v==='A'||v==='U')bad++}return Math.max(0,Math.min(30,until)-bad)}
/* days and OT worked in [from..to] of month m */
function attRange(k,m,from,to){let bad=0,ot=0;for(let d=from;d<=to;d++){const [v]=attCell(k,m,d);if(!v||v==='A'||v==='U')bad++;ot+=dayHours(k,m,d)[1]}return{days:Math.max(0,Math.min(30,to-from+1)-bad),ot:Math.round(ot*10)/10}}
function salDesc(c){const dd=num(c.salDays),ot=num(c.salOT),mn=c.salM?new Date(+c.salM.slice(0,4),+c.salM.slice(5,7)-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}):'';
  const rng=c.salF&&c.salU?' from '+dmy(c.salF)+' to '+dmy(c.salU):c.salF?' from '+dmy(c.salF):c.salU?' up to '+dmy(c.salU):'';
  return (rng?'Salary entitlement for '+hfmt(dd)+' days worked'+rng:'Salary for '+mn+' · '+hfmt(dd)+' days')+(ot?' + '+hfmt(ot)+' OT hours':'')}
function salPaidIn(k,m){return S.cash.filter(c=>c.empKey===k&&c.type==='Salary Payment'&&c.salM===m).reduce((s,c)=>s+num(c.amt),0)}
function salCalc(k,m,days,otH){const p=attPay(k,m);if(!p)return null;const r={...p,days,otH};const c=payCalc(r);return{...r,...c,rate:p.rate}}
function attPayBlock(k,m,print){const p=attPay(k,m);if(!p)return '';const r2=x=>money(Math.round(x*100)/100);
  const rows=[[_('الراتب الأساسي','Basic salary'),r2(p.basic)],[_('البدلات (سكن ومواصلات وغيرها)','Allowances'),r2(p.allow)],[_('أيام مستحقة','Payable days'),p.days+' / 30'],
   [_('الأساسي المستحق','Basic earned'),r2(p.basicE)],[_('البدلات المستحقة','Allowances earned'),r2(p.allowE)],
   [_('الإضافي','Overtime')+' ('+hfmt(p.otH)+' '+_('ساعة','h')+' × '+r2(p.rate)+')',r2(p.ot)],[_('مكافآت','Bonuses'),r2(p.bonus)],
   [_('الإجمالي','Gross'),r2(p.gross)],[_('خصومات','Deductions'),p.deduct?'− '+r2(p.deduct):r2(0)],[_('سلف','Advances'),p.adv?'− '+r2(p.adv):r2(0)]];
  if(print){let h='';for(let i=0;i<rows.length;i+=2)h+='<tr><td>'+rows[i][0]+'</td><td class="ltr">'+rows[i][1]+'</td><td>'+(rows[i+1]||['',''])[0]+'</td><td class="ltr">'+(rows[i+1]||['',''])[1]+'</td></tr>';
   return '<table class="rtab slim tsal"><thead><tr><th colspan="4">'+_('حساب الراتب','Salary calculation')+'</th></tr></thead><tbody>'+h+'<tr class="net"><td colspan="3"><b>'+_('صافي المستحق','Net pay')+'</b></td><td class="ltr"><b>'+r2(p.net)+'</b></td></tr></tbody></table>'}
  return '<section class="panel" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b>'+_('حساب الراتب','Salary calculation')+'</b><span class="muted" style="font-size:12px">'+_('الإضافي = الأساسي ÷ 30 ÷ 8 × 1.25 للساعة · نفس حسبة كشف المرتبات','OT = basic ÷ 30 ÷ 8 × 1.25 per hour · same as payroll')+'</span></div>'+
   '<table class="atday" style="max-width:560px"><tbody>'+rows.map(([a,b])=>'<tr><td>'+a+'</td><td class="num" dir="ltr" style="text-align:end">'+b+'</td></tr>').join('')+
   '<tr><td><b style="font-size:15px">'+_('صافي المستحق','Net pay')+'</b></td><td class="num" dir="ltr" style="text-align:end;font-size:18px;font-weight:800;color:var(--ok)">'+r2(p.net)+'</td></tr>'+
   (salPaidIn(k,m)?'<tr><td>'+_('اتصرف كاش من الصندوق','Paid in cash')+'</td><td class="num" dir="ltr" style="text-align:end">− '+r2(salPaidIn(k,m))+'</td></tr><tr><td><b>'+_('الباقي له','Still owed')+'</b></td><td class="num" dir="ltr" style="text-align:end;font-weight:800">'+r2(p.net-salPaidIn(k,m))+'</td></tr>':'')+
   '</tbody></table><div style="margin-top:10px"><button class="btn pri" data-act="aesalpay" data-k="'+k+'">💵 '+_('صرف الراتب كاش من الصندوق','Pay salary in cash')+'</button></div></section>'}
const monthName=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleDateString(LANG==='en'?'en-GB':'ar-EG',{month:'long',year:'numeric'})};

function rvDoc(){if(!S.rv)S.rv={date:TODAY.slice(0,7)+'-01',sugg:{...DEF_SUGG},rows:{}};S.rv.rows=S.rv.rows||{};S.rv.sugg={...DEF_SUGG,...(S.rv.sugg||{})};return S.rv}

async function rvFlush(){if(rvSaving||!rvDirty||!S.db)return;rvSaving=true;rvDirty=false;try{await S.db.doc('drafts/raises').set(S.rv)}catch(e){toast(ERRSAVE())}rvSaving=false;if(rvDirty)rvFlush()}

function jobGroups(list){const out=[];for(const [k,,ws] of regGroups(list)){const by=new Map();for(const e of ws){const d=(e.designation||'').trim()||_('بدون مسمى','No title');const key=d.toUpperCase().replace(/\s+/g,' ').replace(/\s*\/\s*/g,'/');if(!by.has(key))by.set(key,[d,[]]);by.get(key)[1].push(e)}for(const [,[d,l]] of by)out.push([k,d,l])}return out}
const catSel=(id,cur)=>'<select id="'+id+'"><option value="">'+_('كل الوظائف','All jobs')+'</option>'+RCAT_ALL().map(([ck,cl])=>'<option value="'+ck+'"'+(cur===ck?' selected':'')+'>'+esc(cl)+'</option>').join('')+'</select>';

/* ---------- auto-read passport / Emirates ID (MRZ) ---------- */
const MRZ_NAT={IND:'India',LKA:'Sri Lanka',ETH:'Ethiopia',KEN:'Kenya',PAK:'Pakistan',BGD:'Bangladesh',NPL:'Nepal',EGY:'Egypt',SYR:'Syria',PHL:'Philippines',UGA:'Uganda',GHA:'Ghana',NGA:'Nigeria',SDN:'Sudan',JOR:'Jordan',ARE:'United Arab Emirates'};
const mrzCd=x=>{const w=[7,3,1];let t=0;for(let i=0;i<x.length;i++){const c=x[i];const v=c==='<'?0:/\d/.test(c)?+c:c.charCodeAt(0)-55;t+=v*w[i%3]}return t%10};
const mrzDig=x=>x.replace(/[OQDU]/g,'0').replace(/[IL\]|]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6').replace(/T/g,'7');
function mrzDate(x,future){const y=+x.slice(0,2),m=x.slice(2,4),d=x.slice(4,6);if(+m<1||+m>12||+d<1||+d>31)return '';const now=new Date().getFullYear()%100;const Y=future?2000+y:(y>now?1900+y:2000+y);return Y+'-'+m+'-'+d}
function parseMRZ(text){const lines=String(text||'').toUpperCase().split(/\n/).map(l=>l.replace(/\s+/g,'').replace(/[«‹]/g,'<').replace(/[^A-Z0-9<]/g,'')).filter(l=>l.length>=20);
  const toAlpha=x=>x.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B').replace(/2/g,'Z').replace(/6/g,'G');
  const chk=(d,c)=>{d=mrzDig(d);c=mrzDig(c);return /^\d{6}$/.test(d)&&/^\d$/.test(c)&&mrzCd(d)===+c?d:null};
  // Emirates ID (TD1)
  for(let i=0;i<lines.length;i++){const m=mrzDig(lines[i]).match(/784\d{12}/);if(!m||!/AR[E3]/.test(lines[i]))continue;const id=m[0];
    for(let j=i+1;j<Math.min(lines.length,i+3);j++){const re=/([0-9A-Z]{6})([0-9A-Z])([MF<])([0-9A-Z]{6})([0-9A-Z])([A-Z0-9<]{3})/g;let mm;
      while((mm=re.exec(lines[j]))){const dob=chk(mm[1],mm[2]),ex=chk(mm[4],mm[5]);if(!dob&&!ex){re.lastIndex=mm.index+1;continue}
        return{kind:'eid',eid:id.slice(0,3)+'-'+id.slice(3,7)+'-'+id.slice(7,14)+'-'+id.slice(14),dob:dob?mrzDate(dob,false):'',exp:ex?mrzDate(ex,true):'',sex:mm[3]==='F'?'Female':mm[3]==='M'?'Male':'',nat:MRZ_NAT[toAlpha(mm[6])]||''}}}}
  // Passport (TD3)
  for(let i=0;i<lines.length;i++){const re=/([A-Z0-9<]{8,9})([0-9A-Z])([A-Z0-9<]{3})([0-9A-Z]{6})([0-9A-Z])([MF<])([0-9A-Z]{6})([0-9A-Z])/g;let mm;

function attDoc(m,create){if(!S.att[m]&&create)S.att[m]={month:m,rows:{}};const d=S.att[m];if(d)d.rows=d.rows||{};return d}

const tmin=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
function workedH(i,o,brk){const a=tmin(i),b=tmin(o);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;d-=(brk==null?SHIFT().b:brk);return Math.max(0,Math.round(d/6)/10)}

function parseT(v,kind){v=String(v==null?'':v).trim().toLowerCase().replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x));if(!v)return '';
  const ap=/(p|م)/.test(v)?'p':/(a|ص)/.test(v)?'a':null;const mt=v.replace(/[^0-9:.]/g,'').replace('.',':').match(/^(\d{1,2})(?::?(\d{2}))?$/);if(!mt)return null;
  let h=+mt[1];const mi=+(mt[2]||0);if(h>23||mi>59)return null;

/* ---------- camp rooms ---------- */
const roomNo=v=>String(v==null?'':v).trim();
const roomCmp=(a,b)=>((parseFloat(a)||1e9)-(parseFloat(b)||1e9))||String(a).localeCompare(String(b));
function campRooms(){const R=(S.lists.rooms||[]).map(r=>({no:roomNo(r.no),cap:num(r.cap)})).filter(r=>r.no);for(const e of active()){const n=roomNo(e.room);if(n&&!R.some(r=>r.no===n))R.push({no:n,cap:0})}return R.sort((a,b)=>roomCmp(a.no,b.no))}
const campOrder=list=>jobGroups(list).flatMap(g=>g[2]);
const roomPeople=no=>campOrder(active().filter(e=>roomNo(e.room)===no));
function campStats(){const R=campRooms(),act=active();const cap=R.reduce((s,r)=>s+r.cap,0),occ=act.filter(e=>roomNo(e.room)).length;return{rooms:R.length,cap,occ,free:R.reduce((s,r)=>s+Math.max(0,r.cap-roomPeople(r.no).length),0),none:act.filter(e=>!roomNo(e.room)).length}}
const roomState=(n,cap)=>!cap?['info',_('السعة غير محددة','Capacity not set')]:n>cap?['bad',_('زيادة ','Over by ')+(n-cap)]:n===cap?['warn',_('كاملة','Full')]:['ok',_('فاضي ','Free ')+(cap-n)];
function renderCamp(v){const st=campStats();
  v.innerHTML='<div class="head"><h2>'+_('السكن · توزيع الغرف','Camp · Room distribution')+'</h2><span class="count" id="cmcount"></span><span class="sp"></span><button class="btn" data-act="newroom">+ '+_('غرفة جديدة','New room')+'</button><button class="btn pri" data-act="repcamp">'+_('كشف السكن للطباعة','Print room list')+'</button></div>'+
  '<div class="toolbar"><input type="search" id="campq" placeholder="'+_('ابحث بالاسم أو الرقم أو المهنة أو الغرفة','Search name, ID, job or room')+'" value="'+esc(S.camp.q)+'"><span class="muted">'+_('غيّر غرفة أي عامل من القائمة اللي تحت اسمه، والتعديل بيتحفظ لوحده.','Change a worker\'s room from the menu under the name; it saves automatically.')+'</span></div>'+
  '<div class="kpis">'+kpi('kb',st.rooms,_('عدد الغرف','Rooms'),'cm','')+kpi('kt',st.cap,_('السعة الكلية','Total beds'),'cm','')+kpi('kg',st.occ,_('ساكنين','Housed'),'cm','occ')+kpi('ka',st.free,_('أماكن فاضية','Free beds'),'cm','free')+kpi(st.none?'kr':'kg',st.none,_('بدون سكن','No room'),'cm','none')+'</div>'+kfBar('cm',kfOf('cm')==='occ'?st.occ:kfOf('cm')==='free'?st.free:st.none)+
  '<div class="board" id="cmboard" data-kft="cm"></div>';fillCamp()}
function fillCamp(){const b=$('#cmboard');if(!b)return;const q=S.camp.q.trim().toLowerCase(),R=campRooms();
  const m=e=>!q||[e.name,e.empId,e.designation,e.room].join(' ').toLowerCase().includes(q);
  const ro=cur=>'<option value="">'+_('بدون سكن','No room')+'</option>'+R.map(r=>'<option value="'+esc(r.no)+'"'+(roomNo(cur)===r.no?' selected':'')+'>'+_('غرفة ','Room ')+esc(r.no)+'</option>').join('');
  const wk=e=>'<div class="wk">'+avatar(e)+'<div class="wk-t" data-act="open" data-k="'+e._k+'"><div class="nm">'+esc(e.name)+newPill(e)+'</div><div class="sub">'+(e.empId?'<span class="id">'+esc(e.empId)+'</span> · ':'')+esc(e.designation||'—')+'</div></div>'+
    '<select class="mv" data-chg="room" data-k="'+e._k+'" aria-label="'+_('نقل لغرفة','Move to room')+'" title="'+_('نقل لغرفة','Move to room')+'">'+ro(e.room)+'</select></div>';
  const ck=kfOf('cm');const none=ck&&ck!=='none'?[]:campOrder(active().filter(e=>!roomNo(e.room))).filter(m);let shownN=none.length;
  const cards=ck==='none'?'':R.map(r=>{const ps=roomPeople(r.no),sh=ps.filter(m);if(ck==='occ'&&!ps.length)return '';if(ck==='free'&&!(r.cap>ps.length))return '';if(q&&!sh.length&&!r.no.toLowerCase().includes(q))return '';const list=q&&r.no.toLowerCase().includes(q)?ps:sh;shownN+=list.length;const [cls,lab]=roomState(ps.length,r.cap);const pct=r.cap?Math.min(100,ps.length/r.cap*100):0;
    return '<section class="col room"><div class="col-h"><h3>'+_('غرفة ','Room ')+'<span class="ltr">'+esc(r.no)+'</span></h3>'+pill(cls,lab)+'<span class="sp"></span><span class="cb" dir="ltr">'+ps.length+' / '+r.cap+'</span></div><div class="room-bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div><div class="col-b">'+(list.length?list.map(wk).join(''):'<div class="empty" style="padding:14px">'+_('الغرفة فاضية','Empty room')+'</div>')+'</div>'+
     '<div class="room-f"><label>'+_('السعة','Beds')+' <input type="number" min="0" max="99" value="'+r.cap+'" data-chg="roomcap" data-r="'+esc(r.no)+'"></label><span class="sp"></span><button class="btn sm" data-act="reproom" data-r="'+esc(r.no)+'">'+_('طباعة','Print')+'</button>'+(ps.length?'':' <button class="btn sm danger" data-act="delroom" data-r="'+esc(r.no)+'">'+_('حذف','Delete')+'</button>')+'</div></section>'}).join('');
  $('#cmcount').textContent=campStats().occ+' '+_('ساكن','housed');
  b.innerHTML=(ck&&!none.length&&!cards?'<section class="panel" style="grid-column:1/-1">'+kfEmpty()+'</section>':'')+(none.length?'<section class="col none"><div class="col-h"><h3>'+_('بدون سكن','No room')+'</h3><span class="sp"></span><span class="cb">'+none.length+'</span></div><div class="col-b">'+none.map(wk).join('')+'</div></section>':'')+cards+(!shownN&&q?'<div class="panel empty" style="grid-column:1/-1"><b>'+_('مفيش نتايج','No results')+'</b></div>':'')}
async function saveRooms(R){if(!canWrite())return false;const Ls=JSON.parse(JSON.stringify(S.lists));Ls.rooms=R.map(r=>({no:r.no,cap:num(r.cap)}));try{await S.db.doc('config/lists').set(Ls);S.lists.rooms=Ls.rooms;return true}catch(err){toast(ERRSAVE());return false}}
function repRooms(nos){const all=!nos;const R=campRooms().filter(r=>all||nos.includes(r.no));const st=campStats();let html='';
  if(all)html+='<div class="boxes"><div><b>'+st.rooms+'</b><span>'+_('غرف','Rooms')+'</span></div><div><b>'+st.cap+'</b><span>'+_('السعة','Beds')+'</span></div><div><b>'+st.occ+'</b><span>'+_('ساكنين','Housed')+'</span></div><div><b>'+st.free+'</b><span>'+_('أماكن فاضية','Free beds')+'</span></div></div>'+
   '<table class="rtab slim"><thead><tr><th>'+_('الغرفة','Room')+'</th><th>'+_('السعة','Capacity')+'</th><th>'+_('الساكنين','Allocated')+'</th><th>'+_('فاضي','Available')+'</th><th>'+_('الحالة','Status')+'</th></tr></thead><tbody>'+
   R.map(r=>{const n=roomPeople(r.no).length;return '<tr><td class="ltr"><b>'+esc(r.no)+'</b></td><td class="ltr">'+r.cap+'</td><td class="ltr">'+n+'</td><td class="ltr">'+Math.max(0,r.cap-n)+'</td><td>'+esc(roomState(n,r.cap)[1])+'</td></tr>'}).join('')+
   '<tr style="background:#eef3f8"><td><b>'+_('الإجمالي','Total')+'</b></td><td class="ltr"><b>'+st.cap+'</b></td><td class="ltr"><b>'+st.occ+'</b></td><td class="ltr"><b>'+st.free+'</b></td><td></td></tr></tbody></table>';
  html+=R.map(r=>{const ps=roomPeople(r.no);return '<div class="rm-blk"><h2>'+_('غرفة ','Room ')+'<span class="ltr">'+esc(r.no)+'</span> <span style="color:#5a6878;font-weight:400">('+ps.length+' / '+r.cap+')</span></h2><table class="rtab slim"><thead><tr><th style="width:8mm">#</th><th style="width:13mm">'+_('الصورة','Photo')+'</th><th>'+_('الكود','Code')+'</th><th>'+_('الاسم','Name')+'</th><th>'+_('الوظيفة','Job title')+'</th><th>'+_('الصفة','Type')+'</th><th style="width:30mm">'+_('توقيع العامل','Signature')+'</th></tr></thead><tbody>'+
   (ps.length?ps.map((e,i)=>'<tr><td>'+(i+1)+'</td><td class="tph">'+rAv(e,'tav sm')+'</td><td>'+rl(e.empId)+'</td><td class="en" style="font-weight:600">'+esc(e.name)+'</td><td class="en">'+rt(e.designation)+'</td><td>'+kindLabel(rcat(e))+'</td><td></td></tr>').join(''):'<tr><td colspan="7" class="mu">'+_('الغرفة فاضية','Empty room')+'</td></tr>')+'</tbody></table></div>'}).join('');
  const none=all?campOrder(active().filter(e=>!roomNo(e.room))):[];
  if(none.length)html+='<div class="rm-blk"><h2>'+_('بدون سكن','No room')+' <span style="color:#5a6878;font-weight:400">('+none.length+')</span></h2><table class="rtab slim"><thead><tr><th>#</th><th>'+_('الكود','Code')+'</th><th>'+_('الاسم','Name')+'</th><th>'+_('الوظيفة','Job title')+'</th></tr></thead><tbody>'+none.map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+rl(e.empId)+'</td><td class="en">'+esc(e.name)+'</td><td class="en">'+rt(e.designation)+'</td></tr>').join('')+'</tbody></table></div>';
  return rShell(rHead(all?_('كشف السكن · توزيع الغرف','Camp Room Distribution'):_('كشف غرفة ','Room List ')+esc(nos.join(', ')),dmy(TODAY))+html,false)}
async function campPrint(nos){const ps=nos?active().filter(e=>nos.includes(roomNo(e.room))):active().filter(e=>roomNo(e.room));await preloadPhotos(ps);showReport(repRooms(nos),(nos?'Room_'+nos.join('_'):'Camp_Rooms')+'_'+TODAY+'.html',nos?_('غرفة ','Room ')+nos.join(', '):_('كشف السكن','Room list'),false)}

const CTYPES=[['Cash Received',['استلام نقدية','Cash received'],'in'],['Advance Returned',['رد سلفة','Advance returned'],'in'],['Salary Payment',['صرف راتب كاش','Salary paid in cash'],'out'],['Worker Advance',['سلفة عامل','Worker advance'],'out'],['Cash Advance',['سلفة / مبلغ لشخص','Cash given to a person'],'out'],['Factory Purchase',['مشتريات مصنع','Factory purchase'],'out'],['Camp Expense',['مصاريف الكامب','Camp expense'],'out'],['Transport',['مواصلات','Transport'],'out'],['Maintenance',['صيانة','Maintenance'],'out'],['Other Expense',['مصروفات أخرى','Other expense'],'out']];
const ctype=t=>CTYPES.find(x=>x[0]===t)||[t,[t,t],'out'];
const isIn=c=>ctype(c.type)[2]==='in';
const cashOpening=()=>num(S.lists.cashOpening);
function cashSorted(){return [...S.cash].sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.no||'').localeCompare(b.no||''))}
function cashWithBal(){let bal=cashOpening();return cashSorted().map(c=>{bal+=isIn(c)?num(c.amt):-num(c.amt);return{...c,bal}})}
function nextVoucher(){const m=S.cash.map(c=>parseInt(String(c.no||'').replace(/\D/g,''),10)).filter(n=>n>0);return 'PC-'+String((m.length?Math.max(...m):0)+1).padStart(3,'0')}
function advMonth(d){if(!d)return '';const y=+d.slice(0,4),m=+d.slice(5,7)-1;const x=new Date(y,m-1,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function advIn(k,month){return S.cash.filter(c=>c.empKey===k&&c.type==='Worker Advance'&&advMonth(c.d)===month).reduce((s,c)=>s+num(c.amt),0)}
function cashFiltered(){const f=S.cf,rows=cashWithBal();return rows.filter(c=>(!f.m||(c.d||'').startsWith(f.m))&&(!f.t||c.type===f.t)&&(!f.q||[c.party,c.desc,c.no,c.ref,...cEmps(c).map(e=>e.name+' '+(e.empId||''))].join(' ').toLowerCase().includes(f.q.toLowerCase())))}
function cashPeriod(){const f=S.cf,all=cashWithBal();const before=f.m?all.filter(c=>(c.d||'')<f.m+'-01'):[];const open=f.m?(before.length?before[before.length-1].bal:cashOpening()):cashOpening();
  const inP=all.filter(c=>!f.m||(c.d||'').startsWith(f.m));const rin=inP.filter(isIn).reduce((s,c)=>s+num(c.amt),0),rout=inP.filter(c=>!isIn(c)).reduce((s,c)=>s+num(c.amt),0);return{open,rin,rout,close:open+rin-rout}}
/* a cash entry can be for one worker (empKey) or a group (empKeys, first = empKey) */
const cEmpKeys=c=>(c.empKeys&&c.empKeys.length?c.empKeys:(c.empKey?[c.empKey]:[]));
const cEmps=c=>cEmpKeys(c).map(byKey).filter(Boolean);
const payee=c=>{const es=cEmps(c);if(es.length>1)return es.map(e=>e.name).join(', ');const e=es[0];return e?e.name:(c.party||'')};

function wsel(sel,keep){const box=document.createElement('div');box.className='wsel';sel.after(box);sel.hidden=true;
  const inp=document.createElement('input');inp.type='search';inp.autocomplete='off';inp.dir='auto';inp.placeholder=_('اكتب اسم العامل أو الكود…','Type a worker name or code…');
  const ul=document.createElement('div');ul.className='wsel-l';ul.hidden=true;box.append(inp,ul);
  const label=k=>{const e=byKey(k);return e?e.name+(e.empId?' — '+e.empId:''):''};
  const pool=[...sel.options].map(o=>o.value).filter(Boolean).map(byKey).filter(Boolean);
  let hits=[],cur=0;
  const show=()=>{const q=inp.value.trim().toLowerCase();const toks=q.split(/\s+/).filter(Boolean);
    hits=pool.filter(e=>{const h=[e.name,e.empId,e.designation].join(' ').toLowerCase();return toks.every(t=>h.includes(t))});
    if(q)hits.sort((a,b)=>{const sa=(String(a.empId||'').toLowerCase().startsWith(q)||a.name.toLowerCase().startsWith(q))?0:1,sb=(String(b.empId||'').toLowerCase().startsWith(q)||b.name.toLowerCase().startsWith(q))?0:1;return sa-sb||a.name.localeCompare(b.name)});
    hits=hits.slice(0,60);cur=0;
    ul.innerHTML=hits.length?hits.map((e,i)=>'<div class="wsel-o'+(i===cur?' on':'')+'" data-i="'+i+'">'+avatar(e)+'<div><div class="nm">'+esc(e.name)+newPill(e)+'</div><div class="sub">'+(e.empId?'<span class="id">'+esc(e.empId)+'</span> · ':'')+esc(e.designation||'')+'</div></div></div>').join(''):'<div class="wsel-none">'+_('مفيش عامل بالاسم ده','No matching worker')+'</div>';ul.hidden=false};
  const pick=e=>{sel.value=e._k;inp.value=label(e._k);ul.hidden=true;box.classList.add('set');sel.dispatchEvent(new Event('change',{bubbles:true}))};
  const mark=()=>{ul.querySelectorAll('.wsel-o').forEach((o,i)=>o.classList.toggle('on',i===cur));const o=ul.querySelector('.wsel-o.on');if(o)o.scrollIntoView({block:'nearest'})};
  if(sel.value){inp.value=label(sel.value);box.classList.add('set')}
  inp.addEventListener('focus',()=>{inp.select();show()});
  inp.addEventListener('click',()=>{if(box.classList.contains('set'))inp.select();if(ul.hidden)show()});
  inp.addEventListener('input',()=>{box.classList.remove('set');if(!keep&&sel.value){sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}))}show()});
  inp.addEventListener('keydown',ev=>{if(ul.hidden)return;if(ev.key==='ArrowDown'){ev.preventDefault();cur=Math.min(hits.length-1,cur+1);mark()}else if(ev.key==='ArrowUp'){ev.preventDefault();cur=Math.max(0,cur-1);mark()}else if(ev.key==='Enter'){ev.preventDefault();if(hits[cur])pick(hits[cur])}else if(ev.key==='Escape'){ev.stopPropagation();ul.hidden=true}});
  ul.addEventListener('mousedown',ev=>{const o=ev.target.closest('.wsel-o');if(o){ev.preventDefault();pick(hits[+o.dataset.i])}});
  inp.addEventListener('blur',()=>setTimeout(()=>{ul.hidden=true;if(!sel.value)inp.value='';else inp.value=label(sel.value)},120))}

  const done=()=>{if(got.e&&got.l&&got.c&&got.p&&got.b)S.ready=true;if(S.ready)refresh()};
  const fail=()=>{S.ready=false;renderChrome();toast(_('انقطع الاتصال بقاعدة البيانات. أعد تحميل الصفحة.','Lost connection to the database. Reload the page.'),6000)};
  db.collection('employees').onSnapshot(s=>{S.emps=s.docs.map(d=>({_k:d.id,...d.data()}));S.passCount={};for(const e of S.emps)if(e.passportNo)S.passCount[e.passportNo]=(S.passCount[e.passportNo]||0)+1;got.e=true;done()},fail);
  db.collection('leaves').onSnapshot(s=>{S.leaves=s.docs.map(d=>({_k:d.id,...d.data()}));got.l=true;done()},fail);
  db.collection('payroll').onSnapshot(s=>{const P={};for(const d of s.docs)P[d.id]=JSON.parse(JSON.stringify(d.data()));for(const m in S.payroll)if(paySaving||payDirty){if(m===S.pay.month)P[m]=S.payroll[m]}S.payroll=P;got.p=true;done()},fail);
  db.collection('bonuses').onSnapshot(s=>{S.bonuses=s.docs.map(d=>({_k:d.id,...d.data()}));got.b=true;done()},fail);
  db.doc('config/lists').onSnapshot(s=>{S.lists={...DEFAULT_LISTS,...(s.exists?s.data():{})};got.c=true;done()},fail);
})();
function refresh(){const r=route();const ae=document.activeElement;
  if(r==='profile'&&ae&&ae.id==='lognote'&&ae.value){renderChrome();return}
  if(r==='board'&&S.board.edit&&ae&&ae.dataset&&(ae.dataset.chg==='desig'||ae.dataset.chg==='regpos')){renderChrome();return}
  if(r==='board'&&S.board.busy){return}
  if(r==='pay'&&ae&&ae.dataset&&(ae.dataset.pf||ae.dataset.rv||ae.dataset.rvs)){renderChrome();return}
  if(S.rvBusy)return;
  if(r==='dist'&&$('#dboard')){renderChrome();fillDist();renderDrawer();return}
  if(r==='pass'){const ae2=document.activeElement;if(ae2&&(ae2.id==='ppq'||(ae2.dataset&&(ae2.dataset.pps||ae2.dataset.ppb)))){renderChrome();return}}
  if(r==='camp'&&$('#cmboard')){if(ae&&ae.dataset&&ae.dataset.chg==='roomcap'){renderChrome();return}render();return}
  if(r==='force'&&$('#fgrid')){renderChrome();fillForce();renderDrawer();return}
  if(r==='workers'&&$('#wtable')){renderChrome();fillWorkers();renderDrawer();return}
  if(r==='data'&&$('#ls_designations')){renderChrome();renderDrawer();return}
  render()}
</script>
