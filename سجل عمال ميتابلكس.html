/* ---------- utils ---------- */

const $=s=>document.querySelector(s);

const ICON={

/* ---------- tablet attendance (kiosk) ---------- */
const K={code:'',k:null,done:null,list:null,idle:null,clock:null,busy:false,pin:''};
const kNow=()=>{const n=new Date();return{ymd:n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()),hm:pad(n.getHours())+':'+pad(n.getMinutes()),n}};
const kNorm=s=>String(s||'').toUpperCase().replace(/[\s\-_.\/]/g,'');
function kPool(){return S.emps.filter(e=>!INACTIVE.has(e.status)&&(e.empId||'').trim())}
function kFind(code){const c=kNorm(code);if(!c)return [];const pool=kPool();const ex=pool.filter(e=>kNorm(e.empId)===c);if(ex.length)return ex;
  if(/^\d+$/.test(c)){const n=String(+c);return pool.filter(e=>{const dg=(kNorm(e.empId).match(/\d+$/)||[''])[0];return dg&&String(+dg)===n})}return []}
function kRow(k,ymd,create){const m=ymd.slice(0,7),d=+ymd.slice(8);const doc=attDoc(m,create);if(!doc)return null;if(!doc.rows[k]&&!create)return null;const r=doc.rows[k]=doc.rows[k]||{d:{},ot:''};r.d=r.d||{};return {r,d,m}}
function kToday(k){const {ymd}=kNow();const x=kRow(k,ymd,false);if(!x)return {in:'',out:''};const p=(x.r.k&&x.r.k[x.d])||[];const ins=p.filter(z=>z.x==='in'),outs=p.filter(z=>z.x==='out');

async function rvApply(btn){if(!canWrite())return;const D=rvDoc();const items=Object.entries(D.rows).filter(([k,r])=>num(r.a)>0&&byKey(k));
  if(!items.length)return toast(_('مفيش زيادات مكتوبة','No raises entered'));
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent=_('تأكيد اعتماد ','Confirm ')+items.length+_(' زيادة',' raises');return}
  await rvFlush();S.rvBusy=true;let done=0;toast(_('جاري الاعتماد…','Applying…'),20000);
  for(const [k,r] of items){const e=JSON.parse(JSON.stringify(byKey(k)));const before=totalOf(e),a=num(r.a);e.basic=num(e.basic)+a;
    const rr={id:newKey('r'),d:D.date||TODAY,at:Date.now(),before,amount:a,after:before+a,to:'basic',rating:r.r?+r.r:'',note:(r.r?rateLabel(r.r):'')+(r.n?(r.r?' · ':'')+r.n:'')};
    e.raises=[...(e.raises||[]),rr];logPush(e,_('زيادة راتب: ','Salary raise: ')+money(before)+' → '+money(before+a)+(r.r?' · '+_('التقييم: ','Rating: ')+rateLabel(r.r):''));
    try{await putEmp(e);done++;delete D.rows[k]}catch(err){}}
  for(const k in D.rows){if(D.rows[k].r&&!num(D.rows[k].a))delete D.rows[k]}
  try{await S.db.doc('drafts/raises').set(D)}catch(e){}
  S.rvBusy=false;toast(_('تم اعتماد ','Approved ')+done+_(' زيادة',' raises'),5000);render()}

/* a worker with a job title and a join date that has arrived is working — no "not joined yet" */
const shouldJoin=e=>e&&e.status==='Pending Joining'&&!!(e.designation||'').trim()&&!!e.joinDate&&e.joinDate<=TODAY;
function autoJoin(){if(!canWrite()||!S.emps)return;S._ajoin=S._ajoin||{};for(const e of S.emps){if(!shouldJoin(e)||S._ajoin[e._k])continue;S._ajoin[e._k]=1;
  const x=JSON.parse(JSON.stringify(e));x.status='Working';if(!x.location)x.location='Factory';logPush(x,_('حالة العمل: جديد → على رأس العمل (باشر من ','Status: New → Working (joined ')+dmy(x.joinDate)+')');
  e.status='Working';if(!e.location)e.location='Factory';putEmp(x).catch(()=>{S._ajoin[e._k]=0;toast(ERRSAVE())})}}
function autoSyncPay(m){const doc=S.payroll[m];if(!doc||doc.locked||!canWrite())return;S._psync=S._psync||{};if(S._psync[m])return;const miss=payMissing(m,doc);if(!miss.length)return;S._psync[m]=1;
  for(const e of miss)doc.rows[e._k]=payRowFor(e,m);savePayDoc(m).then(()=>{toast(_('اتضاف للكشف تلقائي: ','Added to the sheet automatically: ')+miss.map(e=>e.name).join('، '));if(route()==='pay')render()}).catch(()=>toast(ERRSAVE())).finally(()=>{S._psync[m]=0})}

  if(!doc){const nob=active().filter(e=>!num(e.basic)).length;

     (nob?'<div class="note" style="margin:14px auto 0;max-width:520px">'+nob+' '+_('عامل مالهمش راتب أساسي مسجل. تقدر تدخله في الكشف مباشرة أو من ملف العامل.','workers have no basic salary recorded. Enter it in the sheet or in the worker profile.')+'</div>':'')+
     '<div style="margin-top:16px"><button class="btn pri" data-act="paynew">'+_('إنشاء كشف الشهر','Create this month\'s sheet')+'</button></div></div>';return}
  const keys=payKeys(doc);

  const inp=(k,f,step)=>'<input type="number" class="pin" min="0" step="'+(step||'any')+'" data-pf="'+f+'" data-k="'+k+'" value="'+(doc.rows[k][f]===''?'':num(doc.rows[k][f]))+'"'+dis+'>';
  v.innerHTML=head+(doc.locked?'<div class="note" style="background:var(--ok-soft);color:var(--ok)">'+_('الكشف معتمد ومقفول للتعديل.','This sheet is approved and locked.')+'</div>':'')+
  '<div class="kpis" id="paykpis"></div>'+

  payTotals()}
const atFactory=e=>!!e&&!INACTIVE.has(e.status)&&(!e.location||e.location==='Factory');
function payKeys(doc){const ord=new Map(jobGroups(S.emps).flatMap(g=>g[2]).map((e,i)=>[e._k,i]));return Object.keys(doc.rows||{}).filter(k=>atFactory(byKey(k))).sort((a,b)=>(ord.has(a)?ord.get(a):1e6)-(ord.has(b)?ord.get(b):1e6)||(doc.rows[a].name||'').localeCompare(doc.rows[b].name||''))}
const payDesig=(k,r)=>{const e=byKey(k);return (e&&e.designation)||r.designation||''};
function payTotals(){const doc=S.payroll[S.pay.month];if(!doc)return;const rows=payKeys(doc).map(k=>doc.rows[k]);const T={b:0,a:0,ot:0,bo:0,d:0,ad:0,net:0};
  for(const r of rows){const c=payCalc(r);T.b+=c.basicE;T.a+=c.allowE;T.ot+=c.ot;T.bo+=num(r.bonus);T.d+=num(r.deduct);T.ad+=num(r.adv);T.net+=c.net}
  const k=$('#paykpis');if(k)k.innerHTML='<div class="kpi kb"><b>'+rows.length+'</b><span>'+_('عدد العمال في الكشف','Workers on sheet')+'</span></div><div class="kpi kg"><b>'+money(T.b+T.a)+'</b><span>'+_('الأساسي والبدلات','Basic + allowances')+'</span></div><div class="kpi kt"><b>'+money(T.ot+T.bo)+'</b><span>'+_('إضافي ومكافآت','Overtime + bonuses')+'</span></div><div class="kpi kr"><b>'+money(T.d+T.ad)+'</b><span>'+_('خصومات وسلف','Deductions + advances')+'</span></div><div class="kpi ka"><b>'+money(T.net)+'</b><span>'+_('صافي المستحق (درهم)','Net payable (AED)')+'</span></div>';
  const f=$('#paytot');if(f)f.innerHTML='<tr><td></td><td><b>'+_('الإجمالي','Total')+'</b></td><td class="num">'+money(T.b)+'</td><td class="num">'+money(T.a)+'</td><td></td><td></td><td class="num">'+money(T.ot)+'</td><td class="num">'+money(T.bo)+'</td><td class="num">'+money(T.d)+'</td><td class="num">'+money(T.ad)+'</td><td class="num netc">'+money(T.net)+'</td></tr>';
  return T}

/* ---------- manual attendance ---------- */
const ACODES=[['P',['حاضر','Present'],'ok'],['A',['غائب','Absent'],'bad'],['O',['راحة (الأحد)','Day off (Sun)'],'mut'],['L',['إجازة','Leave'],'info'],['S',['مرضي','Sick'],'warn'],['U',['بدون راتب','Unpaid'],'pur']];
const acode=c=>ACODES.find(x=>x[0]===c);
const LVCODE={'Annual Leave':'L','Sick Leave':'S','Emergency Leave':'L','Unpaid Leave':'U'};
let attT=null,attSaving=false,attDirty=false;
function attDoc(m,create){if(!S.att[m]&&create)S.att[m]={month:m,rows:{}};const d=S.att[m];if(d)d.rows=d.rows||{};return d}
function attSave(){attDirty=true;clearTimeout(attT);attT=setTimeout(attFlush,700)}
async function attFlush(){if(attSaving||!attDirty||!S.db)return;attSaving=true;attDirty=false;const m=S.af.m;try{await S.db.collection('attendance').doc(m).set(S.att[m])}catch(e){toast(ERRSAVE())}attSaving=false;if(attDirty)attFlush()}
const monDays=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const dstr=(m,d)=>m+'-'+pad(d);
const OFFDAY=0,SUN_END='13:00',SUN_OT=6;const isFri=(m,d)=>pd(dstr(m,d)).getDay()===OFFDAY;
/* shift: start / end / break (minutes) -> standard hours */
const SHIFT=()=>({s:'07:00',e:S.lists.shiftEnd||'16:00',b:S.lists.shiftBreak==null||S.lists.shiftBreak===''?60:num(S.lists.shiftBreak)});
const tmin=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
function workedH(i,o,brk){const a=tmin(i),b=tmin(o);if(a==null||b==null)return 0;let d=b-a;if(d<=0)d+=1440;d-=(brk==null?SHIFT().b:brk);return Math.max(0,Math.round(d/6)/10)}
const shiftEndOf=k=>{const e=k&&byKey(k);return (e&&e.shiftEnd)||SHIFT().e};
const stdH=k=>{const sh=SHIFT();return workedH(sh.s,shiftEndOf(k),sh.b)};
const SHIFT_ENDS=['15:00','16:00','17:00','18:00','19:00','20:00'];
const hm12=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+(m?':'+pad(m):'')+(h<12?' AM':' PM')};
const hfmt=h=>h?(Math.round(h*10)/10).toString():'0';
function leaveCodeOn(k,date){const l=S.leaves.find(x=>x.empKey===k&&x.from<=date&&x.to>=date&&!(x.returned&&x.returned<=date));return l?(LVCODE[l.type]||'L'):''}
function attCell(k,m,d){const r=(attDoc(m)||{rows:{}}).rows[k];const v=r&&r.d&&r.d[d];if(v)return [v,false];const lc=leaveCodeOn(k,dstr(m,d));if(lc)return [lc,true];if(isFri(m,d))return ['O',true];return ['',false]}
const attTime=(k,m,d)=>{const r=(attDoc(m)||{rows:{}}).rows[k];return r&&r.t&&r.t[d]||null};
/* per-day hours: [worked, overtime] */
function dayHours(k,m,d){const [c]=attCell(k,m,d);if(c!=='P')return [0,0];const tm=attTime(k,m,d),sun=isFri(m,d);
  if(!tm){const std=stdH(k);return sun?[SUN_OT,SUN_OT]:[std,0]}
  const w=workedH(tm.i,tm.o,sun?0:undefined);return sun?[w,w]:[w,Math.max(0,Math.round((w-stdH(k))*10)/10)]}
function attSum(k,m){const doc=attDoc(m);if(!doc||!doc.rows[k])return null;const t=attRowTot(k,m);return{...t,ot:t.otAll}}
function attList(){const f=S.af,q=f.q.trim().toLowerCase();return jobGroups(active().filter(e=>(!f.cat||rcat(e)===f.cat)&&(!q||[e.name,e.empId,e.designation].join(' ').toLowerCase().includes(q)))).flatMap(g=>g[2])}
function attRowTot(k,m){const doc=attDoc(m),n=monDays(m),c={P:0,A:0,O:0,L:0,S:0,U:0,sun:0,hrs:0,otT:0};
  for(let d=1;d<=n;d++){const [v]=attCell(k,m,d);if(v)c[v]++;if(v==='P'&&isFri(m,d))c.sun++;const [w,o]=dayHours(k,m,d);c.hrs+=w;c.otT+=o}
  c.hrs=Math.round(c.hrs*10)/10;c.otT=Math.round(c.otT*10)/10;const ot=doc&&doc.rows[k]?num(doc.rows[k].ot):0;

    if(await ppSave(e,{passState:'in',passOut:undefined},(e.passSlot?_('البسبور #','Passport #')+ppNo(e):_('البسبور','Passport'))+_(' رجع الخزنة',' back in the safe'))){closeModal();toast(_('البسبور رجع الخزنة','Passport back in the safe'));render();if(pr)showReport(repPPSlip(e,'in'),'Passport_'+(e.empId||ppNo(e))+'_return.html',_('إيصال رجوع جواز ','Passport return ')+e.name,false)}})}

/* ---------- camp rooms ---------- */
const roomNo=v=>String(v==null?'':v).trim();
const roomCmp=(a,b)=>((parseFloat(a)||1e9)-(parseFloat(b)||1e9))||String(a).localeCompare(String(b));
function campRooms(){const R=(S.lists.rooms||[]).map(r=>({no:roomNo(r.no),cap:num(r.cap)})).filter(r=>r.no);for(const e of active()){const n=roomNo(e.room);if(n&&!R.some(r=>r.no===n))R.push({no:n,cap:0})}return R.sort((a,b)=>roomCmp(a.no,b.no))}
const campOrder=list=>jobGroups(list).flatMap(g=>g[2]);
const roomPeople=no=>campOrder(active().filter(e=>roomNo(e.room)===no));
function campStats(){const R=campRooms(),act=active();const cap=R.reduce((s,r)=>s+r.cap,0),occ=act.filter(e=>roomNo(e.room)).length;return{rooms:R.length,cap,occ,free:R.reduce((s,r)=>s+Math.max(0,r.cap-roomPeople(r.no).length),0),none:act.filter(e=>!roomNo(e.room)).length}}
const roomState=(n,cap)=>!cap?['info',_('السعة غير محددة','Capacity not set')]:n>cap?['bad',_('زيادة ','Over by ')+(n-cap)]:n===cap?['warn',_('كاملة','Full')]:['ok',_('فاضي ','Free ')+(cap-n)];
function renderCamp(v){const st=campStats();
  v.innerHTML='<div class="head"><h2>'+_('السكن · توزيع الغرف','Camp · Room distribution')+'</h2><span class="count" id="cmcount"></span><span class="sp"></span><button class="btn" data-act="newroom">+ '+_('غرفة جديدة','New room')+'</button><button class="btn pri" data-act="repcamp">'+_('كشف السكن للطباعة','Print room list')+'</button></div>'+
  '<div class="toolbar"><input type="search" id="campq" placeholder="'+_('ابحث بالاسم أو الرقم أو المهنة أو الغرفة','Search name, ID, job or room')+'" value="'+esc(S.camp.q)+'"><span class="muted">'+_('غيّر غرفة أي عامل من القائمة اللي تحت اسمه، والتعديل بيتحفظ لوحده.','Change a worker\'s room from the menu under the name; it saves automatically.')+'</span></div>'+
  '<div class="kpis"><div class="kpi kb"><b>'+st.rooms+'</b><span>'+_('عدد الغرف','Rooms')+'</span></div><div class="kpi kt"><b>'+st.cap+'</b><span>'+_('السعة الكلية','Total beds')+'</span></div><div class="kpi kg"><b>'+st.occ+'</b><span>'+_('ساكنين','Housed')+'</span></div><div class="kpi ka"><b>'+st.free+'</b><span>'+_('أماكن فاضية','Free beds')+'</span></div><div class="kpi '+(st.none?'kr':'kg')+'"><b>'+st.none+'</b><span>'+_('بدون سكن','No room')+'</span></div></div>'+
  '<div class="board" id="cmboard"></div>';fillCamp()}
function fillCamp(){const b=$('#cmboard');if(!b)return;const q=S.camp.q.trim().toLowerCase(),R=campRooms();
  const m=e=>!q||[e.name,e.empId,e.designation,e.room].join(' ').toLowerCase().includes(q);
  const ro=cur=>'<option value="">'+_('بدون سكن','No room')+'</option>'+R.map(r=>'<option value="'+esc(r.no)+'"'+(roomNo(cur)===r.no?' selected':'')+'>'+_('غرفة ','Room ')+esc(r.no)+'</option>').join('');
  const wk=e=>'<div class="wk">'+avatar(e)+'<div class="wk-t" data-act="open" data-k="'+e._k+'"><div class="nm">'+esc(e.name)+(e.status==='Pending Joining'?' '+pill('info',_('جديد','New')):'')+'</div><div class="sub">'+(e.empId?'<span class="id">'+esc(e.empId)+'</span> · ':'')+esc(e.designation||'—')+'</div></div>'+
    '<select class="mv" data-chg="room" data-k="'+e._k+'" aria-label="'+_('نقل لغرفة','Move to room')+'" title="'+_('نقل لغرفة','Move to room')+'">'+ro(e.room)+'</select></div>';
  const none=campOrder(active().filter(e=>!roomNo(e.room))).filter(m);let shownN=none.length;
  const cards=R.map(r=>{const ps=roomPeople(r.no),sh=ps.filter(m);if(q&&!sh.length&&!r.no.toLowerCase().includes(q))return '';const list=q&&r.no.toLowerCase().includes(q)?ps:sh;shownN+=list.length;const [cls,lab]=roomState(ps.length,r.cap);const pct=r.cap?Math.min(100,ps.length/r.cap*100):0;
    return '<section class="col room"><div class="col-h"><h3>'+_('غرفة ','Room ')+'<span class="ltr">'+esc(r.no)+'</span></h3>'+pill(cls,lab)+'<span class="sp"></span><span class="cb" dir="ltr">'+ps.length+' / '+r.cap+'</span></div><div class="room-bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div><div class="col-b">'+(list.length?list.map(wk).join(''):'<div class="empty" style="padding:14px">'+_('الغرفة فاضية','Empty room')+'</div>')+'</div>'+
     '<div class="room-f"><label>'+_('السعة','Beds')+' <input type="number" min="0" max="99" value="'+r.cap+'" data-chg="roomcap" data-r="'+esc(r.no)+'"></label><span class="sp"></span><button class="btn sm" data-act="reproom" data-r="'+esc(r.no)+'">'+_('طباعة','Print')+'</button>'+(ps.length?'':' <button class="btn sm danger" data-act="delroom" data-r="'+esc(r.no)+'">'+_('حذف','Delete')+'</button>')+'</div></section>'}).join('');
  $('#cmcount').textContent=campStats().occ+' '+_('ساكن','housed');
  b.innerHTML=(none.length?'<section class="col none"><div class="col-h"><h3>'+_('بدون سكن','No room')+'</h3><span class="sp"></span><span class="cb">'+none.length+'</span></div><div class="col-b">'+none.map(wk).join('')+'</div></section>':'')+cards+(!shownN&&q?'<div class="panel empty" style="grid-column:1/-1"><b>'+_('مفيش نتايج','No results')+'</b></div>':'')}
async function saveRooms(R){if(!canWrite())return false;const Ls=JSON.parse(JSON.stringify(S.lists));Ls.rooms=R.map(r=>({no:r.no,cap:num(r.cap)}));try{await S.db.doc('config/lists').set(Ls);S.lists.rooms=Ls.rooms;return true}catch(err){toast(ERRSAVE());return false}}
function repRooms(nos){const all=!nos;const R=campRooms().filter(r=>all||nos.includes(r.no));const st=campStats();let html='';
  if(all)html+='<div class="boxes"><div><b>'+st.rooms+'</b><span>'+_('غرف','Rooms')+'</span></div><div><b>'+st.cap+'</b><span>'+_('السعة','Beds')+'</span></div><div><b>'+st.occ+'</b><span>'+_('ساكنين','Housed')+'</span></div><div><b>'+st.free+'</b><span>'+_('أماكن فاضية','Free beds')+'</span></div></div>'+

  html+=R.map(r=>{const ps=roomPeople(r.no);return '<div class="rm-blk"><h2>'+_('غرفة ','Room ')+'<span class="ltr">'+esc(r.no)+'</span> <span style="color:#5a6878;font-weight:400">('+ps.length+' / '+r.cap+')</span></h2><table class="rtab slim"><thead><tr><th style="width:8mm">#</th><th style="width:13mm">'+_('الصورة','Photo')+'</th><th>'+_('الكود','Code')+'</th><th>'+_('الاسم','Name')+'</th><th>'+_('الوظيفة','Job title')+'</th><th>'+_('الصفة','Type')+'</th><th style="width:30mm">'+_('توقيع العامل','Signature')+'</th></tr></thead><tbody>'+
   (ps.length?ps.map((e,i)=>'<tr><td>'+(i+1)+'</td><td class="tph">'+rAv(e,'tav sm')+'</td><td>'+rl(e.empId)+'</td><td class="en" style="font-weight:600">'+esc(e.name)+'</td><td class="en">'+rt(e.designation)+'</td><td>'+kindLabel(rcat(e))+'</td><td></td></tr>').join(''):'<tr><td colspan="7" class="mu">'+_('الغرفة فاضية','Empty room')+'</td></tr>')+'</tbody></table></div>'}).join('');
  const none=all?campOrder(active().filter(e=>!roomNo(e.room))):[];
  if(none.length)html+='<div class="rm-blk"><h2>'+_('بدون سكن','No room')+' <span style="color:#5a6878;font-weight:400">('+none.length+')</span></h2><table class="rtab slim"><thead><tr><th>#</th><th>'+_('الكود','Code')+'</th><th>'+_('الاسم','Name')+'</th><th>'+_('الوظيفة','Job title')+'</th></tr></thead><tbody>'+none.map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+rl(e.empId)+'</td><td class="en">'+esc(e.name)+'</td><td class="en">'+rt(e.designation)+'</td></tr>').join('')+'</tbody></table></div>';
  return rShell(rHead(all?_('كشف السكن · توزيع الغرف','Camp Room Distribution'):_('كشف غرفة ','Room List ')+esc(nos.join(', ')),dmy(TODAY))+html,false)}

const CTYPES=[['Cash Received',['استلام نقدية','Cash received'],'in'],['Advance Returned',['رد سلفة','Advance returned'],'in'],['Worker Advance',['سلفة عامل','Worker advance'],'out'],['Cash Advance',['سلفة / مبلغ لشخص','Cash given to a person'],'out'],['Factory Purchase',['مشتريات مصنع','Factory purchase'],'out'],['Camp Expense',['مصاريف الكامب','Camp expense'],'out'],['Transport',['مواصلات','Transport'],'out'],['Maintenance',['صيانة','Maintenance'],'out'],['Other Expense',['مصروفات أخرى','Other expense'],'out']];
const ctype=t=>CTYPES.find(x=>x[0]===t)||[t,[t,t],'out'];
const isIn=c=>ctype(c.type)[2]==='in';
const cashOpening=()=>num(S.lists.cashOpening);
function cashSorted(){return [...S.cash].sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.no||'').localeCompare(b.no||''))}
function cashWithBal(){let bal=cashOpening();return cashSorted().map(c=>{bal+=isIn(c)?num(c.amt):-num(c.amt);return{...c,bal}})}
function nextVoucher(){const m=S.cash.map(c=>parseInt(String(c.no||'').replace(/\D/g,''),10)).filter(n=>n>0);return 'PC-'+String((m.length?Math.max(...m):0)+1).padStart(3,'0')}
function advIn(k,month){return S.cash.filter(c=>c.empKey===k&&c.type==='Worker Advance'&&(c.d||'').startsWith(month)).reduce((s,c)=>s+num(c.amt),0)}
function cashFiltered(){const f=S.cf,rows=cashWithBal();return rows.filter(c=>(!f.m||(c.d||'').startsWith(f.m))&&(!f.t||c.type===f.t)&&(!f.q||[c.party,c.desc,c.no,c.ref,(byKey(c.empKey)||{}).name].join(' ').toLowerCase().includes(f.q.toLowerCase())))}
function cashPeriod(){const f=S.cf,all=cashWithBal();const before=f.m?all.filter(c=>(c.d||'')<f.m+'-01'):[];const open=f.m?(before.length?before[before.length-1].bal:cashOpening()):cashOpening();
  const inP=all.filter(c=>!f.m||(c.d||'').startsWith(f.m));const rin=inP.filter(isIn).reduce((s,c)=>s+num(c.amt),0),rout=inP.filter(c=>!isIn(c)).reduce((s,c)=>s+num(c.amt),0);return{open,rin,rout,close:open+rin-rout}}

function wsel(sel){const box=document.createElement('div');box.className='wsel';sel.after(box);sel.hidden=true;
  const inp=document.createElement('input');inp.type='search';inp.autocomplete='off';inp.dir='auto';inp.placeholder=_('اكتب اسم العامل أو الكود…','Type a worker name or code…');
  const ul=document.createElement('div');ul.className='wsel-l';ul.hidden=true;box.append(inp,ul);
  const label=k=>{const e=byKey(k);return e?e.name+(e.empId?' — '+e.empId:''):''};
  const pool=[...sel.options].map(o=>o.value).filter(Boolean).map(byKey).filter(Boolean);
  let hits=[],cur=0;
  const show=()=>{const q=inp.value.trim().toLowerCase();const toks=q.split(/\s+/).filter(Boolean);
    hits=pool.filter(e=>{const h=[e.name,e.empId,e.designation].join(' ').toLowerCase();return toks.every(t=>h.includes(t))});
    if(q)hits.sort((a,b)=>{const sa=(String(a.empId||'').toLowerCase().startsWith(q)||a.name.toLowerCase().startsWith(q))?0:1,sb=(String(b.empId||'').toLowerCase().startsWith(q)||b.name.toLowerCase().startsWith(q))?0:1;return sa-sb||a.name.localeCompare(b.name)});
    hits=hits.slice(0,60);cur=0;
    ul.innerHTML=hits.length?hits.map((e,i)=>'<div class="wsel-o'+(i===cur?' on':'')+'" data-i="'+i+'">'+avatar(e)+'<div><div class="nm">'+esc(e.name)+'</div><div class="sub">'+(e.empId?'<span class="id">'+esc(e.empId)+'</span> · ':'')+esc(e.designation||'')+'</div></div></div>').join(''):'<div class="wsel-none">'+_('مفيش عامل بالاسم ده','No matching worker')+'</div>';ul.hidden=false};
  const pick=e=>{sel.value=e._k;inp.value=label(e._k);ul.hidden=true;box.classList.add('set');sel.dispatchEvent(new Event('change',{bubbles:true}))};
  const mark=()=>{ul.querySelectorAll('.wsel-o').forEach((o,i)=>o.classList.toggle('on',i===cur));const o=ul.querySelector('.wsel-o.on');if(o)o.scrollIntoView({block:'nearest'})};
  if(sel.value){inp.value=label(sel.value);box.classList.add('set')}
  inp.addEventListener('focus',()=>{inp.select();show()});
  inp.addEventListener('click',()=>{if(box.classList.contains('set'))inp.select();if(ul.hidden)show()});
  inp.addEventListener('input',()=>{box.classList.remove('set');if(sel.value){sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}))}show()});
  inp.addEventListener('keydown',ev=>{if(ul.hidden)return;if(ev.key==='ArrowDown'){ev.preventDefault();cur=Math.min(hits.length-1,cur+1);mark()}else if(ev.key==='ArrowUp'){ev.preventDefault();cur=Math.max(0,cur-1);mark()}else if(ev.key==='Enter'){ev.preventDefault();if(hits[cur])pick(hits[cur])}else if(ev.key==='Escape'){ev.stopPropagation();ul.hidden=true}});
  ul.addEventListener('mousedown',ev=>{const o=ev.target.closest('.wsel-o');if(o){ev.preventDefault();pick(hits[+o.dataset.i])}});
  inp.addEventListener('blur',()=>setTimeout(()=>{ul.hidden=true;if(!sel.value)inp.value='';else inp.value=label(sel.value)},120))}

function cellToYmd(v){if(v==null||v==='')return '';if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);return ''}
async function readImport(file){const res=$('#impres');if(!window.XLSX){res.innerHTML='<div class="err">'+_('مكتبة الإكسل لم تُحمّل. أعد فتح الصفحة.','The Excel library did not load. Reopen the page.')+'</div>';return}
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets['Employee Master List']||wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});const hi=aoa.findIndex(r=>r&&r.some(c=>String(c??'').trim()==='Employee Name'));
    if(hi<0){res.innerHTML='<div class="err">'+_('لم أجد عمود "Employee Name" في الملف.','No "Employee Name" column found.')+'</div>';return}
    const H=aoa[hi].map(c=>String(c??'').trim().toLowerCase());const map=XL.filter(c=>c[1]&&c[1]!=='sn').map(([h,k,x])=>[H.indexOf(h.toLowerCase()),k,x]).filter(c=>c[0]>=0);
    const plan={create:[],update:[]};const seen=new Set();
    for(const r of aoa.slice(hi+1)){if(!r)continue;const rec={};for(const [i,k,x] of map){let v=r[i];if(typeof v==='string'&&v.startsWith('#'))v='';rec[k]=x==='d'?cellToYmd(v):x==='n'?(v==null||v===''?'':num(v)):(v==null?'':String(v).trim())}
      if(!rec.name)continue;if(rec.company==='Visit Visa')rec.company='';
      const ex=S.emps.find(e=>rec.empId?e.empId===rec.empId:(e.name||'').toUpperCase()===rec.name.toUpperCase());
      if(ex){if(seen.has(ex._k))continue;seen.add(ex._k);const n=JSON.parse(JSON.stringify(ex));const changed=[];for(const k in rec){if(rec[k]!==''&&rec[k]!=null&&String(rec[k])!==String(n[k]??'')){changed.push(FIELD_LABEL(k));n[k]=rec[k]}}if(changed.length){logPush(n,_('تحديث من ملف إكسل: ','Updated from Excel: ')+changed.join(', '));plan.update.push(n)}}
      else plan.create.push(rec)}
    S.importPlan=plan;
    res.innerHTML='<div class="note" style="background:var(--accent-soft);color:var(--ink)">'+plan.create.length+' '+_('عامل جديد','new workers')+' · '+plan.update.length+' '+_('عامل هتتحدث بياناته','workers to update')+'</div>'+(plan.create.length+plan.update.length?'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" data-act="runimport">'+_('تنفيذ الاستيراد','Run import')+'</button><button class="btn" data-act="cancelimport">'+_('إلغاء','Cancel')+'</button></div>':'<p class="muted">'+_('لا يوجد تغيير.','Nothing to change.')+'</p>')}
  catch(err){res.innerHTML='<div class="err">'+_('تعذر قراءة الملف: ','Could not read the file: ')+esc(err.message||err)+'</div>'}}
async function runImport(){if(!canWrite()||!S.importPlan)return;const p=S.importPlan;S.importPlan=null;let sn=Math.max(0,...S.emps.map(x=>x.sn||0)),done=0;const total=p.create.length+p.update.length;
  $('#impres').innerHTML='<p class="muted" id="impprog">…</p>';const prog=()=>{const el=$('#impprog');if(el)el.textContent=done+' / '+total};
  try{for(const rec of p.create){const e={...Object.fromEntries(FIELD_KEYS.map(k=>[k,''])),...rec,_k:newKey('e'),sn:++sn,log:[]};logPush(e,_('تمت الإضافة من ملف إكسل','Added from Excel'));await putEmp(e);done++;prog()}
    for(const e of p.update){await putEmp(e);done++;prog()}
    $('#impres').innerHTML='<p style="color:var(--ok)">'+_('تم استيراد ','Imported ')+done+' '+_('سجل','records')+'</p>'}catch(err){$('#impres').innerHTML='<div class="err">'+_('توقف بعد ','Stopped after ')+done+': '+esc(err.message||err.code||'')+'</div>'}}

  else if(t.id==='she'||t.id==='shb'){if(!canWrite())return;const Ls=JSON.parse(JSON.stringify(S.lists));Ls.shiftStart='07:00';Ls.shiftEnd=$('#she').value||'16:00';Ls.shiftBreak=Math.max(0,num($('#shb').value));S.lists=Ls;S.db.doc('config/lists').set(Ls).then(()=>{toast(_('تم حفظ الدوام','Shift saved'));render()}).catch(()=>toast(ERRSAVE()))}
  else if(t.id==='amonth'&&t.value){attFlush();S.af.m=t.value;render()}
  else if(t.id==='cm'){S.cf.m=t.value;render()}else if(t.id==='ct'){S.cf.t=t.value;render()}
  else if(t.id==='salcat'){S.sal.cat=t.value;render()}
  else if(t.id==='rper'){S.raise.per=t.value;render()}
  else if(t.id==='pmonth'&&t.value){flushPay();S.pay.month=t.value;render()}});

/* ---------- boot ---------- */
{const st=document.createElement('style');st.textContent=REP_CSS;document.head.appendChild(st)}
const bootErr=m=>{if(S.ready)return;const v=$('#view');if(v)v.innerHTML='<div class="panel empty"><b>'+_('حصلت مشكلة في تحميل السيستم','The system failed to load')+'</b><div class="mono" style="font-size:12px;margin-top:8px">'+esc(String(m||''))+'</div>'+_('اعمل تحديث للصفحة.','Reload the page.')+'</div>'};
window.addEventListener('error',ev=>bootErr(ev.message));window.addEventListener('unhandledrejection',ev=>bootErr(ev.reason&&(ev.reason.message||ev.reason)));
renderChrome();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  let [db,dl,as]=await Promise.all([use('db'),use('downloads'),use('assets')]);S.dl=dl;S.assets=as;
  if(!db){S.db=false;renderChrome();$('#view').innerHTML='<div class="panel empty"><b>'+_('قاعدة البيانات غير متاحة في هذا العرض','The database is not available in this view')+'</b>'+_('افتح الصفحة من حسابك على claude.ai عشان تظهر بيانات العمال.','Open this page from your claude.ai account to see the workers.')+'</div>';return}
  const fwd=(t,over)=>new Proxy({},{get:(_o,pr)=>{if(over&&pr in over)return over[pr];const v=t[pr];return typeof v==='function'?v.bind(t):v}});
  const wRef=r=>r?fwd(r,{set:(...a)=>r.set(...a).then(x=>{savedFlash();return x}),update:(...a)=>r.update(...a).then(x=>{savedFlash();return x}),delete:(...a)=>r.delete(...a).then(x=>{savedFlash();return x})}):r;
  const rawDb=db;let dbw=rawDb;try{dbw=fwd(rawDb,{collection:n=>{const c=rawDb.collection(n);return fwd(c,{doc:id=>wRef(c.doc(id))})},doc:pth=>wRef(rawDb.doc(pth))})}catch(err){dbw=rawDb}
  db=dbw;
  S.db=db;const got={e:false,l:false,c:false,p:false,b:false};
  db.collection('attendance').onSnapshot(s=>{if(attSaving||attDirty)return;const A={};for(const d of s.docs)A[d.id]=JSON.parse(JSON.stringify(d.data()));S.att=A;if(S.ready&&route()==='att'){const ae=document.activeElement;if(!(ae&&ae.dataset&&(ae.dataset.aot||ae.dataset.atd)))render()}},()=>{});
  db.collection('cash').onSnapshot(s=>{S.cash=s.docs.map(d=>({_k:d.id,...d.data()}));if(S.ready)refresh()},()=>{});
  db.doc('drafts/raises').onSnapshot(s=>{if(rvSaving||rvDirty)return;S.rv=s.exists?JSON.parse(JSON.stringify(s.data())):null;if(S.ready&&route()==='pay'&&S.pay.tab==='review'){const ae=document.activeElement;if(!(ae&&ae.dataset&&ae.dataset.rv))render()}},()=>{});
  const done=()=>{if(got.e&&got.l&&got.c&&got.p&&got.b)S.ready=true;if(S.ready)refresh()};
  const fail=()=>{S.ready=false;renderChrome();toast(_('انقطع الاتصال بقاعدة البيانات. أعد تحميل الصفحة.','Lost connection to the database. Reload the page.'),6000)};
  db.collection('employees').onSnapshot(s=>{S.emps=s.docs.map(d=>({_k:d.id,...d.data()}));S.passCount={};for(const e of S.emps)if(e.passportNo)S.passCount[e.passportNo]=(S.passCount[e.passportNo]||0)+1;got.e=true;done()},fail);
  db.collection('leaves').onSnapshot(s=>{S.leaves=s.docs.map(d=>({_k:d.id,...d.data()}));got.l=true;done()},fail);
  db.collection('payroll').onSnapshot(s=>{const P={};for(const d of s.docs)P[d.id]=JSON.parse(JSON.stringify(d.data()));for(const m in S.payroll)if(paySaving||payDirty){if(m===S.pay.month)P[m]=S.payroll[m]}S.payroll=P;got.p=true;done()},fail);
  db.collection('bonuses').onSnapshot(s=>{S.bonuses=s.docs.map(d=>({_k:d.id,...d.data()}));got.b=true;done()},fail);
  db.doc('config/lists').onSnapshot(s=>{S.lists={...DEFAULT_LISTS,...(s.exists?s.data():{})};got.c=true;done()},fail);
})();
function refresh(){const r=route();const ae=document.activeElement;
  if(r==='profile'&&ae&&ae.id==='lognote'&&ae.value){renderChrome();return}
  if(r==='board'&&S.board.edit&&ae&&ae.dataset&&(ae.dataset.chg==='desig'||ae.dataset.chg==='regpos')){renderChrome();return}
  if(r==='board'&&S.board.busy){return}
  if(r==='pay'&&ae&&ae.dataset&&(ae.dataset.pf||ae.dataset.rv||ae.dataset.rvs)){renderChrome();return}
  if(S.rvBusy)return;
  if(r==='dist'&&$('#dboard')){renderChrome();fillDist();renderDrawer();return}
  if(r==='pass'){const ae2=document.activeElement;if(ae2&&(ae2.id==='ppq'||(ae2.dataset&&(ae2.dataset.pps||ae2.dataset.ppb)))){renderChrome();return}}
  if(r==='camp'&&$('#cmboard')){if(ae&&ae.dataset&&ae.dataset.chg==='roomcap'){renderChrome();return}render();return}
  if(r==='force'&&$('#fgrid')){renderChrome();fillForce();renderDrawer();return}
  if(r==='workers'&&$('#wtable')){renderChrome();fillWorkers();renderDrawer();return}
  if(r==='data'&&$('#ls_designations')){renderChrome();renderDrawer();return}
  render()}
</script>
